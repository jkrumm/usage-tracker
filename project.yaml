# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: usage-tracker
deploy:
  mode: make # `make deploy` (re)installs the ingest LaunchAgent on the mini, which runs this checkout; `make verify` probes the agent, log freshness and source staleness
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
  migrations: [migrations/pg/] # forward-only SQL, applied with `make pg-migrate` before `make deploy`
ship:
  - { paths: ['**'], via: push }
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
