# How the factory ships this project (software-factory docs/project.md).
apiVersion: factory/v2
name: usage-tracker
deploy:
  mode: make # `make deploy` (re)installs the ingest LaunchAgent on the mini, which runs this checkout; `make verify` probes the agent, log freshness and source staleness
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
ship:
  - { via: push }
# one checkout on the mini runs the ingest LaunchAgent and `make deploy` re-bootstraps it, so two leads cannot deploy at once
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
